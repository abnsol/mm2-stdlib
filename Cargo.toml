[package]
name = "mm2-stdlib"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
eval-ffi = { path = "../MORK-T/experiments/eval-ffi" }
eval = { path = "../MORK-T/experiments/eval" }
mork-expr = { path = "../MORK-T/expr" }

# Optional Python bridge
pyo3      = { version = "0.23", features = ["auto-initialize"], optional = true }
once_cell = { version = "1", optional = true }

[features]
default = []
python  = ["dep:pyo3", "dep:once_cell"]